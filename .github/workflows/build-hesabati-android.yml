name: Build Hesabati Android APK

on:
  workflow_dispatch:
  push:
    branches: ["hesabati-android-v1"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Hesabati web asset
        run: |
          cat android_hesabati/app/src/main/assets/index.html.gz.b64.* > /tmp/hesabati.b64
          base64 -d /tmp/hesabati.b64 | gzip -d > android_hesabati/app/src/main/assets/index.html
          rm android_hesabati/app/src/main/assets/index.html.gz.b64.*
          sed -i 's/نسخة مكتبية محلية • تحفظ البيانات على هذا الجهاز/نسخة Android محلية • تحفظ البيانات على هذا الهاتف/g' android_hesabati/app/src/main/assets/index.html
          test -s android_hesabati/app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android_hesabati
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-android-v1-apk
          path: android_hesabati/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
