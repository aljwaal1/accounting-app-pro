name: Build Hesabati Pro UI APK

on:
  workflow_dispatch:
  push:
    branches: [ "hesabati-pro-ui-v2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Flutter source
        shell: bash
        run: |
          cat .native_src/main.part00 .native_src/main.part01 .native_src/main.part02 .native_src/main.part03 .native_src/main.part04 .native_src/main.part05 .native_src/main.part06 .native_src/main.part07 .native_src/main.part08 .native_src/main.part09 > lib/main.dart
          test -s lib/main.dart
          if grep -q "package:webview_flutter" lib/main.dart; then
            echo "WebView dependency detected - build rejected"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms android --org com.hesabati .

      - name: Set Android app name
        shell: bash
        run: |
          sed -i 's/android:label="[^"]*"/android:label="حساباتي"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-pro-ui-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
