name: Build Hesabati Native APK

on:
  workflow_dispatch:
  push:
    branches: [ "hesabati-native-v1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct native Flutter source
        shell: bash
        run: |
          cat .native_src/main.part00 .native_src/main.part01 .native_src/main.part02 .native_src/main.part03 .native_src/main.part04 .native_src/main.part05 .native_src/main.part06 .native_src/main.part07 .native_src/main.part08 .native_src/main.part09 > lib/main.dart
          test "$(wc -c < lib/main.dart)" -eq 71793
          echo "b135e9bafdd740075a2def935a47e40a2ff3562647d645d455d4201a258d3ad7  lib/main.dart" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old = "Text('متاح ${money(p.stock)}',style:const TextStyle(fontSize:10,color:Colors.grey))])))).toList()),"
          new = "Text('متاح ${money(p.stock)}',style:const TextStyle(fontSize:10,color:Colors.grey))]))))).toList()),"
          if old not in s:
              raise SystemExit('POS source patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(wc -c < lib/main.dart)" -eq 71794
          echo "4fae2644ffb32be755c3c3de2e08ccb402aadc5374b8b9d5abb6bff1f5488d1e  lib/main.dart" | sha256sum -c -
          if grep -q "package:webview_flutter" lib/main.dart; then
            echo "WebView dependency detected - native build rejected"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms android --org com.hesabati .

      - name: Set Android app name
        shell: bash
        run: |
          sed -i 's/android:label="[^"]*"/android:label="حساباتي"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Analyze native source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-native-android-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
